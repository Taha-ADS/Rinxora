<!--
  Source artwork for public/horizon-glow.webp: the soft, grainy light of the hero horizon.
  Rendered once to an image because SVG filters (blur, grain) are painted on the CPU in
  Safari and re-running them every frame stalls the hero film on iPhone. The crisp parts
  (planet body, chrome hairline) stay vector in src/components/Horizon.tsx.

  Coordinates match Horizon.tsx: a 1000-unit planet, centre (500, 500), radius 500.
  The viewBox is the only part ever on screen: the upper rim plus the glow above it.
  Re-render at 1600px wide with a transparent background and save as WebP.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -90 1080 520" width="1600" height="770">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.04" stop-color="#1E0A4A" />
      <stop offset="0.16" stop-color="#4C1DB0" />
      <stop offset="0.26" stop-color="#8B2BE2" />
      <stop offset="0.34" stop-color="#D61F8C" />
      <stop offset="0.41" stop-color="#FF3D3D" />
      <stop offset="0.47" stop-color="#FF7A2F" />
      <stop offset="0.5" stop-color="#FFA05A" />
      <stop offset="0.53" stop-color="#FF7A2F" />
      <stop offset="0.59" stop-color="#FF3D3D" />
      <stop offset="0.66" stop-color="#D61F8C" />
      <stop offset="0.74" stop-color="#8B2BE2" />
      <stop offset="0.84" stop-color="#4C1DB0" />
      <stop offset="0.96" stop-color="#1E0A4A" />
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.1" stop-color="#6E6A80" stop-opacity="0" />
      <stop offset="0.3" stop-color="#B9B6C8" stop-opacity="0.55" />
      <stop offset="0.5" stop-color="#FFFFFF" />
      <stop offset="0.7" stop-color="#B9B6C8" stop-opacity="0.55" />
      <stop offset="0.9" stop-color="#6E6A80" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="satin" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.05" stop-color="#2B0F6B" stop-opacity="0" />
      <stop offset="0.28" stop-color="#6D28D9" />
      <stop offset="0.45" stop-color="#B04BE8" />
      <stop offset="0.5" stop-color="#E0569A" />
      <stop offset="0.55" stop-color="#B04BE8" />
      <stop offset="0.72" stop-color="#6D28D9" />
      <stop offset="0.95" stop-color="#2B0F6B" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD2B0" />
      <stop offset="0.22" stop-color="#FF6A2B" />
      <stop offset="0.5" stop-color="#E0247A" stop-opacity="0.7" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <filter id="blur-s" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.4" /></filter>
    <filter id="blur-m" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4" /></filter>
    <filter id="blur-l" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16" /></filter>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="soft" />
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComposite in="soft" in2="mono" operator="arithmetic" k1="1.25" k2="0.35" k3="0" k4="0" />
    </filter>
  </defs>

  <!-- Satin strata inside the rim -->
  <g fill="none" stroke="url(#satin)" filter="url(#blur-m)">
    <circle cx="500" cy="500" r="492" stroke-width="2.2" opacity="0.62" />
    <circle cx="500" cy="500" r="484" stroke-width="3.8" opacity="0.52" />
    <circle cx="500" cy="500" r="473" stroke-width="5.4" opacity="0.42" />
    <circle cx="500" cy="500" r="459" stroke-width="7" opacity="0.32" />
    <circle cx="500" cy="500" r="441" stroke-width="8.6" opacity="0.22" />
  </g>

  <!-- Atmosphere, the grainy hot band, a soft chrome bloom -->
  <circle cx="500" cy="500" r="500" fill="none" stroke="url(#rim)" stroke-width="34" opacity="0.85" filter="url(#blur-l)" />
  <circle cx="500" cy="500" r="496.5" fill="none" stroke="url(#rim)" stroke-width="13" filter="url(#grain)" />
  <circle cx="500" cy="500" r="500.4" fill="none" stroke="url(#chrome)" stroke-width="3" opacity="0.5" filter="url(#blur-s)" />

  <!-- Hot spot beneath the orb -->
  <ellipse cx="500" cy="3" rx="300" ry="30" fill="url(#hot)" filter="url(#blur-m)" opacity="0.95" />
</svg>
